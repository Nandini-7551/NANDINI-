<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Mixer Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f0;min-height:100vh;padding:2rem 1rem;color:#1a1a1a}
.app{max-width:680px;margin:0 auto;background:#fff;border-radius:16px;padding:1.5rem;border:1px solid #e0e0d8}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.topbar h1{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.score-row{display:flex;gap:10px}
.sc{background:#f5f5f0;border-radius:8px;padding:5px 14px;text-align:center}
.sc-val{font-size:18px;font-weight:600}
.sc-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.05em}
.game-area{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.panel{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:1rem}
.panel-title{font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.color-swatch{width:100%;height:90px;border-radius:8px;border:1px solid #e0e0d8;transition:background 0.3s;margin-bottom:8px}
.color-name{font-size:13px;font-weight:600;text-align:center}
.color-hex{font-size:11px;color:#aaa;text-align:center;font-family:monospace}
.match-bar-wrap{margin:10px 0 4px}
.match-bar-label{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px}
.match-bar-track{height:6px;background:#f0f0e8;border-radius:3px;overflow:hidden}
.match-bar-fill{height:100%;border-radius:3px;transition:width 0.4s,background 0.4s}
.palette-section{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:1rem;margin-bottom:12px}
.palette-title{font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.paint-pots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.pot{width:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.pot-circle{width:44px;height:44px;border-radius:50%;border:2.5px solid transparent;transition:transform 0.15s,border-color 0.15s}
.pot:hover .pot-circle{transform:scale(1.1)}
.pot.selected .pot-circle{border-color:#333}
.pot-label{font-size:10px;color:#888;text-align:center}
.sliders{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.slider-group{display:flex;flex-direction:column;gap:4px}
.slider-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.04em}
.slider-val{font-size:12px;font-weight:600;text-align:right}
input[type=range]{width:100%;accent-color:#333;height:4px;cursor:pointer}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 14px;border-radius:8px;cursor:pointer;border:1px solid #ccc;background:#fff;color:#333;transition:background 0.15s,transform 0.1s;font-family:inherit}
.action-btn:hover{background:#f5f5f0}
.action-btn:active{transform:scale(0.97)}
.action-btn.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.action-btn.primary:hover{background:#333}
.feedback{min-height:24px;text-align:center;font-size:13px;color:#666;margin-top:8px;font-style:italic;transition:opacity 0.3s}
.history-section{margin-top:12px}
.hist-title{font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.hist-list{display:flex;gap:6px;flex-wrap:wrap}
.hist-chip{display:flex;align-items:center;gap:6px;background:#f5f5f0;border-radius:20px;padding:4px 10px;font-size:12px;color:#666}
.hist-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.streak-badge{display:none;align-items:center;gap:5px;background:#EAF3DE;color:#3B6D11;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;margin-left:8px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div style="display:flex;align-items:center">
      <h1>&#127912; Color Mixer</h1>
      <span class="streak-badge" id="streakBadge"><span id="streakTxt">3 streak</span></span>
    </div>
    <div class="score-row">
      <div class="sc"><div class="sc-val" id="scoreVal">0</div><div class="sc-lbl">score</div></div>
      <div class="sc"><div class="sc-val" id="levelVal">1</div><div class="sc-lbl">level</div></div>
    </div>
  </div>

  <div class="game-area">
    <div class="panel">
      <div class="panel-title">Target color</div>
      <div class="color-swatch" id="targetSwatch"></div>
      <div class="color-name" id="targetName">—</div>
      <div class="color-hex" id="targetHex">???</div>
    </div>
    <div class="panel">
      <div class="panel-title">Your mix</div>
      <div class="color-swatch" id="mixSwatch" style="background:#808080"></div>
      <div class="color-name" id="mixName">Gray</div>
      <div class="color-hex" id="mixHex">#808080</div>
      <div class="match-bar-wrap">
        <div class="match-bar-label"><span>match</span><span id="matchPct">0%</span></div>
        <div class="match-bar-track"><div class="match-bar-fill" id="matchFill" style="width:0%;background:#639922"></div></div>
      </div>
    </div>
  </div>

  <div class="palette-section">
    <div class="palette-title">Pick a paint color then adjust</div>
    <div class="paint-pots" id="paintPots"></div>
    <div class="sliders">
      <div class="slider-group">
        <div style="display:flex;justify-content:space-between"><span class="slider-lbl">Red</span><span class="slider-val" id="rVal">128</span></div>
        <input type="range" min="0" max="255" value="128" step="1" id="rSlider" oninput="onSlider()">
      </div>
      <div class="slider-group">
        <div style="display:flex;justify-content:space-between"><span class="slider-lbl">Green</span><span class="slider-val" id="gVal">128</span></div>
        <input type="range" min="0" max="255" value="128" step="1" id="gSlider" oninput="onSlider()">
      </div>
      <div class="slider-group">
        <div style="display:flex;justify-content:space-between"><span class="slider-lbl">Blue</span><span class="slider-val" id="bVal">128</span></div>
        <input type="range" min="0" max="255" value="128" step="1" id="bSlider" oninput="onSlider()">
      </div>
    </div>
    <div class="btn-row">
      <button class="action-btn primary" onclick="submitMix()">&#10003; Submit mix</button>
      <button class="action-btn" onclick="resetMix()">&#8635; Reset</button>
      <button class="action-btn" onclick="newRound()">&#8594; New color</button>
      <button class="action-btn" onclick="giveHint()">&#128161; Hint</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="history-section" id="histSec" style="display:none">
    <div class="hist-title">Recent attempts</div>
    <div class="hist-list" id="histList"></div>
  </div>
</div>

<script>
const COLORS=[
  {name:'Crimson red',r:220,g:20,b:60},{name:'Ocean blue',r:30,g:100,b:200},
  {name:'Forest green',r:34,g:120,b:50},{name:'Sunset orange',r:255,g:100,b:30},
  {name:'Lavender',r:150,g:120,b:220},{name:'Goldenrod',r:218,g:165,b:32},
  {name:'Coral pink',r:255,g:110,b:130},{name:'Teal',r:0,g:150,b:140},
  {name:'Amber',r:255,g:170,b:0},{name:'Slate blue',r:80,g:100,b:180},
  {name:'Mint',r:70,g:200,b:160},{name:'Rose',r:210,g:80,b:110},
  {name:'Indigo',r:75,g:0,b:160},{name:'Olive',r:128,g:128,b:0},
  {name:'Sky blue',r:100,g:180,b:240},{name:'Magenta',r:200,g:0,b:180},
  {name:'Chartreuse',r:120,g:200,b:30},{name:'Burnt sienna',r:190,g:90,b:40},
];
const POTS=[
  {name:'Red',r:220,g:30,b:30},{name:'Yellow',r:255,g:220,b:0},
  {name:'Blue',r:30,g:80,b:220},{name:'White',r:255,g:255,b:255},
  {name:'Black',r:20,g:20,b:20},{name:'Orange',r:255,g:130,b:0},
  {name:'Green',r:30,g:170,b:60},{name:'Purple',r:140,g:40,b:180},
  {name:'Pink',r:255,g:140,b:180},{name:'Cyan',r:0,g:200,b:220},
];
let target=null,score=0,level=1,streak=0,history=[],hintUsed=false;
let mr=128,mg=128,mb=128;

function toHex(r,g,b){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function colorName(r,g,b){
  const names=['Red','Coral','Orange','Yellow','Lime','Green','Teal','Cyan','Blue','Indigo','Violet','Magenta'];
  const h=rgbToHsl(r,g,b)[0];
  if(rgbToHsl(r,g,b)[1]<0.15)return r>200?'White':r>120?'Gray':'Black';
  return names[Math.round(h/30)%12];
}
function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){h=s=0;}else{
    const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;}
    h/=6;
  }
  return[h*360,s,l];
}
function matchPct(r1,g1,b1,r2,g2,b2){
  const dr=r1-r2,dg=g1-g2,db=b1-b2;
  return Math.round((1-Math.sqrt(dr*dr+dg*dg+db*db)/Math.sqrt(3*255*255))*100);
}
function buildPots(){
  const c=document.getElementById('paintPots');
  POTS.forEach((p,i)=>{
    const div=document.createElement('div');
    div.className='pot';div.id='pot'+i;
    div.innerHTML=`<div class="pot-circle" style="background:${toHex(p.r,p.g,p.b)}"></div><div class="pot-label">${p.name}</div>`;
    div.onclick=()=>selectPot(i,p);
    c.appendChild(div);
  });
}
function selectPot(i,p){
  document.querySelectorAll('.pot').forEach(el=>el.classList.remove('selected'));
  document.getElementById('pot'+i).classList.add('selected');
  mr=p.r;mg=p.g;mb=p.b;
  document.getElementById('rSlider').value=mr;
  document.getElementById('gSlider').value=mg;
  document.getElementById('bSlider').value=mb;
  updateMixDisplay();
}
function onSlider(){
  mr=+document.getElementById('rSlider').value;
  mg=+document.getElementById('gSlider').value;
  mb=+document.getElementById('bSlider').value;
  document.querySelectorAll('.pot').forEach(el=>el.classList.remove('selected'));
  updateMixDisplay();
}
function updateMixDisplay(){
  document.getElementById('rVal').textContent=mr;
  document.getElementById('gVal').textContent=mg;
  document.getElementById('bVal').textContent=mb;
  const hex=toHex(mr,mg,mb);
  document.getElementById('mixSwatch').style.background=hex;
  document.getElementById('mixHex').textContent=hex;
  document.getElementById('mixName').textContent=colorName(mr,mg,mb);
  if(target){
    const pct=matchPct(mr,mg,mb,target.r,target.g,target.b);
    document.getElementById('matchPct').textContent=pct+'%';
    const fill=document.getElementById('matchFill');
    fill.style.width=pct+'%';
    fill.style.background=pct>=90?'#639922':pct>=70?'#BA7517':'#E24B4A';
  }
}
function newRound(){
  hintUsed=false;
  const pool=COLORS.filter(c=>!history.slice(-3).some(h=>h.name===c.name));
  target=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('targetSwatch').style.background=toHex(target.r,target.g,target.b);
  document.getElementById('targetName').textContent=target.name;
  document.getElementById('targetHex').textContent='???';
  document.getElementById('feedback').textContent='';
  resetMix();
}
function resetMix(){
  mr=128;mg=128;mb=128;
  document.getElementById('rSlider').value=128;
  document.getElementById('gSlider').value=128;
  document.getElementById('bSlider').value=128;
  document.querySelectorAll('.pot').forEach(el=>el.classList.remove('selected'));
  updateMixDisplay();
}
function giveHint(){
  if(!target)return;
  hintUsed=true;
  const hints=[
    `Red channel is around ${Math.round(target.r/51)*51}`,
    `Green channel is around ${Math.round(target.g/51)*51}`,
    `Blue channel is around ${Math.round(target.b/51)*51}`,
    `It's a ${target.r>target.g&&target.r>target.b?'warm':'cool'} tone`,
  ];
  showFeedback(hints[Math.floor(Math.random()*hints.length)],false);
}
function submitMix(){
  if(!target){showFeedback('Start a new round first!',false);return;}
  const pct=matchPct(mr,mg,mb,target.r,target.g,target.b);
  document.getElementById('targetHex').textContent=toHex(target.r,target.g,target.b);
  let pts=0,msg='';
  if(pct>=95){pts=hintUsed?80:100;streak++;msg=`Perfect match! +${pts} pts`;}
  else if(pct>=85){pts=hintUsed?50:70;streak++;msg=`Great match! +${pts} pts`;}
  else if(pct>=70){pts=hintUsed?25:40;streak=Math.max(0,streak-1);msg=`Good try! +${pts} pts`;}
  else if(pct>=55){pts=hintUsed?10:20;streak=0;msg=`Getting closer... +${pts} pts`;}
  else{pts=0;streak=0;msg=`Not quite — ${pct}% match. Try again!`;}
  score+=pts;
  if(score>=(level*150)){level++;msg+=` Level up!`;}
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('levelVal').textContent=level;
  const badge=document.getElementById('streakBadge');
  if(streak>=2){badge.style.display='inline-flex';document.getElementById('streakTxt').textContent=streak+' streak';}
  else{badge.style.display='none';}
  showFeedback(msg,pts>0);
  history.unshift({name:target.name,hex:toHex(target.r,target.g,target.b),pct});
  if(history.length>8)history.pop();
  const sec=document.getElementById('histSec');sec.style.display='block';
  document.getElementById('histList').innerHTML=history.map(h=>
    `<div class="hist-chip"><div class="hist-dot" style="background:${h.hex}"></div>${h.name} — ${h.pct}%</div>`
  ).join('');
  if(pct>=85)setTimeout(newRound,1800);
}
function showFeedback(msg,good){
  const el=document.getElementById('feedback');
  el.style.opacity='0';
  setTimeout(()=>{el.textContent=msg;el.style.color=good?'#3B6D11':'#888';el.style.opacity='1';},100);
}
buildPots();
newRound();
updateMixDisplay();
</script>
</body>
</html>
